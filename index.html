<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wheel of Depression</title>
<style>
  :root{
    --bg:#0e3b2e;
    --panel:#123f30;
    --border:#c9a227;
    --text:#f2e9d8;
    --text-dim:#c9bfa9;
    --accent:#c9a227;
    --zero:#7a1f2b;
    --one:#c9a227;
    --two:#f0a93a;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    font-family:system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    color:var(--text);
  }

  header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:16px 24px;
    border-bottom:1px solid var(--border);
  }

  h1{
    font-size:20px;
    margin:0;
  }

  .balance-box{
    display:flex;
    align-items:center;
    gap:12px;
    text-align:right;
  }

  .balance-label{
    font-size:12px;
    color:var(--text-dim);
    text-transform:uppercase;
    letter-spacing:.05em;
  }

  .balance-amount{
    font-size:24px;
    font-weight:700;
  }

  .Sell-a-Kidney-btn{
    display:none;
    padding:8px 14px;
    font-size:13px;
    font-weight:600;
    color:#0e3b2e;
    background:var(--two);
    border:none;
    border-radius:6px;
    cursor:pointer;
  }

  .Sell-a-Kidney-btn.show{
    display:inline-block;
  }

  main{
    display:flex;
    gap:40px;
    padding:32px 24px;
    max-width:900px;
    align-items:flex-start;
    flex-wrap:wrap;
  }

  .wheel-col{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
  }

  .wheel-wrap{
    position:relative;
    width:220px;
    height:220px;
  }

  .pointer{
    position:absolute;
    top:-4px;
    left:50%;
    transform:translateX(-50%);
    width:0; height:0;
    border-left:9px solid transparent;
    border-right:9px solid transparent;
    border-top:14px solid var(--accent);
    z-index:2;
  }

  #wheel{
    width:100%;
    height:100%;
    display:block;
    border-radius:50%;
    border:2px solid var(--border);
  }

  .spin-btn{
    padding:10px 20px;
    font-size:14px;
    font-weight:600;
    color:#0e3b2e;
    background:var(--accent);
    border:none;
    border-radius:6px;
    cursor:pointer;
  }

  .spin-btn:disabled{
    background:#a3a3a3;
    cursor:not-allowed;
  }

  .info-col{
    flex:1;
    min-width:220px;
  }

  .result-line{
    font-size:14px;
    min-height:20px;
    margin-bottom:20px;
  }

</style>
</head>
<body>

<header>
  <h1>Wheel of Depression</h1>
  <div class="balance-box">
    <button class="Sell-a-Kidney-btn" id="SellaKidneyBtn">Sell a Kidney</button>
    <div>
      <div class="balance-label">Balance</div>
      <div class="balance-amount" id="balance">$20</div>
    </div>
  </div>
</header>

<main>
  <div class="wheel-col">
    <div class="wheel-wrap">
      <div class="pointer"></div>
      <svg id="wheel" viewBox="0 0 200 200"></svg>
    </div>
    <button class="spin-btn" id="spinBtn">Spin $1</button>
  </div>

  <div class="info-col">
    <p class="result-line" id="resultLine">Click spin to play.</p>
  </div>
</main>

<script>
(function(){
  const CX = 100, CY = 100, R = 96;
  const SLICES = 8;
  const SLICE_ANGLE = 360 / SLICES;

  // 4x $0 (50%), 2x $1 (25%), 2x $2 (25%)
  const OUTCOMES = ['$0','$2','$0','$1','$0','$2','$0','$1'];
  const COLORS   = ['zero','two','zero','one','zero','two','zero','one'];
  const FILL = { zero:'#7a1f2b', one:'#c9a227', two:'#f0a93a' };
  const TEXT_FILL = { zero:'#f2e9d8', one:'#0e3b2e', two:'#0e3b2e' };

  function pt(angleDeg, radius){
    const rad = (angleDeg - 90) * Math.PI / 180; // 0deg = top, clockwise
    return { x: CX + radius * Math.cos(rad), y: CY + radius * Math.sin(rad) };
  }

  function buildWheel(){
    const svg = document.getElementById('wheel');
    let markup = '';

    for(let i=0;i<SLICES;i++){
      const start = i * SLICE_ANGLE;
      const end = start + SLICE_ANGLE;
      const p1 = pt(start, R);
      const p2 = pt(end, R);
      const d = `M ${CX} ${CY} L ${p1.x.toFixed(2)} ${p1.y.toFixed(2)} A ${R} ${R} 0 0 1 ${p2.x.toFixed(2)} ${p2.y.toFixed(2)} Z`;
      markup += `<path d="${d}" fill="${FILL[COLORS[i]]}" stroke="#0e3b2e" stroke-width="1"/>`;

      const center = start + SLICE_ANGLE/2;
      const lp = pt(center, R*0.6);
      markup += `<text x="${lp.x.toFixed(2)}" y="${lp.y.toFixed(2)}" text-anchor="middle" dominant-baseline="middle"
                  font-family="system-ui, sans-serif" font-weight="700" font-size="16"
                  fill="${TEXT_FILL[COLORS[i]]}" transform="rotate(${center.toFixed(2)} ${lp.x.toFixed(2)} ${lp.y.toFixed(2)})">${OUTCOMES[i]}</text>`;
    }

    markup += `<circle cx="${CX}" cy="${CY}" r="6" fill="#c9a227"/>`;

    svg.innerHTML = markup;
  }

  buildWheel();

  // game state
  let balance = 20;
  let totalRotation = 0;
  let spinning = false;
  const COST = 1;

  const balanceEl = document.getElementById('balance');
  const spinBtn = document.getElementById('spinBtn');
  const resultLine = document.getElementById('resultLine');
  const wheelEl = document.getElementById('wheel');
  const SellaKidneyBtn = document.getElementById('SellaKidneyBtn');

  function renderBalance(){
    balanceEl.textContent = '$' + balance;
    SellaKidneyBtn.classList.toggle('show', balance === 0);
  }

  function checkGameOver(){
    if(balance < COST){
      spinBtn.disabled = true;
    }
  }

  function spin(){
    if(spinning || balance < COST) return;
    spinning = true;
    spinBtn.disabled = true;

    balance -= COST;
    renderBalance();

    const sliceIndex = Math.floor(Math.random() * SLICES);
    const sliceCenter = sliceIndex * SLICE_ANGLE + SLICE_ANGLE/2;
    const jitter = (Math.random() - 0.5) * (SLICE_ANGLE * 0.7);

    const extraSpins = 6 + Math.floor(Math.random() * 3);
    const targetMod = (360 - sliceCenter - jitter + 360) % 360;
    let delta = targetMod - (totalRotation % 360);
    if(delta <= 0) delta += 360;
    totalRotation += delta + extraSpins * 360;

    wheelEl.style.transition = 'transform 3.6s cubic-bezier(0.12, 0.67, 0.1, 0.99)';
    wheelEl.style.transform = `rotate(${totalRotation}deg)`;

    resultLine.textContent = 'Spinning…';

    const onEnd = function(){
      wheelEl.removeEventListener('transitionend', onEnd);
      const winLabel = OUTCOMES[sliceIndex];
      const winAmount = parseInt(winLabel.replace('$',''), 10);
      balance += winAmount;
      renderBalance();

      resultLine.textContent = 'Result: ' + winLabel;

      spinning = false;
      spinBtn.disabled = false;
      checkGameOver();
    };
    wheelEl.addEventListener('transitionend', onEnd);
  }

  function sellKidney(){
    balance = 4000;
    renderBalance();
    spinBtn.disabled = false;
  }

  spinBtn.addEventListener('click', spin);
  SellaKidneyBtn.addEventListener('click', sellKidney);

  renderBalance();
})();
</script>

</body>
</html>
